name: Deploy to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: 10.10.10.28:5000
  STACK_NAME: slides

jobs:
  deploy:
    runs-on: self-hosted
    environment: Production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deploy files
        run: |
          cat > /tmp/deploy-slides.sh <<'SCRIPT'
          #!/bin/bash
          set -e

          echo "=== Pulling image ==="
          docker pull localhost:5000/slides:latest

          # One-time migration: the old single-deck stack held port 4680
          echo "=== Removing legacy app-dev-slides stack ==="
          docker compose -p app-dev-slides down --remove-orphans || true

          echo "=== Recreating containers ==="
          docker compose -f /tmp/slides-stack.yml -p slides up -d --force-recreate --remove-orphans

          echo "=== Verifying ==="
          docker compose -f /tmp/slides-stack.yml -p slides ps
          echo "=== Deploy complete ==="
          SCRIPT
          sed -i 's/^[[:space:]]*//' /tmp/deploy-slides.sh
          chmod +x /tmp/deploy-slides.sh

      - name: Copy files to production host
        run: |
          SSH_OPTS="-i ~/.ssh/github_runner_key -o StrictHostKeyChecking=no"
          scp $SSH_OPTS portainer-stack.yml github-runner@10.10.10.28:/tmp/slides-stack.yml
          scp $SSH_OPTS /tmp/deploy-slides.sh github-runner@10.10.10.28:/tmp/deploy-slides.sh

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/github_runner_key -o StrictHostKeyChecking=no github-runner@10.10.10.28 "bash /tmp/deploy-slides.sh"
